<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee · Holiday Tracker</title><link rel="stylesheet" href="shared.css"></head><body><main></main>
<script src="shared.js"></script><script>
App.init('employee',()=>{const s=App.s,n=new URLSearchParams(location.search).get('n'),e=s.emps.find(x=>x.n==n);
if(!e){$('main').innerHTML='<p>Employee not found. <a href="forconnor.html">Back to dashboard</a></p>';return}
const c=App.calc(e);document.title=n+' · Holiday Tracker';
$('main').innerHTML=`<h1>${esc(n)}</h1><p>${esc(e.d)} · ${esc(e.team)} · started ${fmt(e.start)}</p>
<div class="stats">${[['Total available',c.total],['Annual leave used',c.used],['Remaining',c.remaining],['Sick days',c.sick],['Bradford Factor',`<span class="pill ${App.bf(c.bf)}">${c.bf}</span>`]].map(([a,b])=>`<div class="card">${a}<b>${b}</b></div>`).join('')}</div>
<p>Total = allowance ${c.base} + carryover ${+e.carry||0} + bank holiday accrual ${c.acc} + long service ${c.ls}.</p>
<h2>Entries</h2><div class="wrap"><table><tr><th>Date<th>Type<th>Days<th>Notes</tr>${s.log.filter(l=>l.e==n).sort((a,b)=>a.d<b.d?1:-1).map(l=>`<tr><td>${fmt(l.d)}<td>${esc(l.t)}<td>${l.days}<td>${esc(l.note)}</tr>`).join('')||'<tr><td>No entries yet.</tr>'}</table></div>`});
</script></body></html>
