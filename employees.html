<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees · Holiday Tracker</title><link rel="stylesheet" href="shared.css"></head><body><main>
<h1>Employees</h1>
<div class="wrap"><table id="e"></table></div><p><button id="add">Add employee</button></p>
<h2>Allowance settings</h2><div class="card row" id="set"></div>
<h2>UK bank holidays</h2><div class="wrap"><table id="bh"></table></div><p><button id="addbh">Add bank holiday</button></p>
<h2>Backup</h2><p>Export the data to keep a copy, or import a previous export.</p>
<div class="row"><button id="ex">Export JSON</button><input type="file" id="im" accept=".json" aria-label="Import JSON"><button class="g" id="rs">Reset to spreadsheet data</button></div></main>
<script src="shared.js"></script><script>
App.init('employees',()=>{const s=App.s;
const lab={a12:'Team 1 & 2 allowance (days)',a5:'5-Day Week allowance (days)',ys:'Holiday year start',ref:'Rota reference week (Monday)',shS:'Shutdown from',shE:'Shutdown to'};
function draw(){
$('#e').innerHTML='<tr><th>Name<th>Department<th>Start date<th>Team<th>Carryover<th>Allowance<th>Accrual<th>Long service<th>Total<th></tr>'+s.emps.map((e,i)=>{const c=App.calc(e),d=`data-i="${i}" data-k`;return `<tr><td><input ${d}="n" value="${esc(e.n)}"><td><input ${d}="d" value="${esc(e.d)}"><td><input type="date" ${d}="start" value="${e.start}"><td><select ${d}="team">${['Team 1','Team 2','5-Day Week'].map(t=>`<option${t==e.team?' selected':''}>${t}</option>`).join('')}</select><td><input type="number" step="0.5" style="width:70px" ${d}="carry" value="${e.carry}"><td>${c.base}<td>${c.acc}<td>${c.ls}<td><b>${c.total}</b><td><button class="g" data-del="${i}">Remove</button></tr>`}).join('');
$('#set').innerHTML=Object.keys(lab).map(k=>`<label>${lab[k]}<input data-s="${k}" ${/^a/.test(k)?'type="number"':'type="date"'} value="${s.set[k]}"></label>`).join('');
$('#bh').innerHTML='<tr><th>Date<th>Name<th></tr>'+s.bh.map((b,i)=>`<tr><td><input type="date" data-b="${i}" data-j="0" value="${b[0]}"><td><input data-b="${i}" data-j="1" value="${esc(b[1])}"><td><button class="g" data-delb="${i}">Remove</button></tr>`).join('')}
document.onchange=e=>{const t=e.target.dataset;
 if(t.k){const o=s.emps[t.i];if(t.k=='n')s.log.forEach(l=>{if(l.e==o.n)l.e=e.target.value});o[t.k]=e.target.value}
 else if(t.s)s.set[t.s]=/^a/.test(t.s)?+e.target.value:e.target.value;
 else if(t.b)s.bh[t.b][t.j]=e.target.value;else return;
 App.save();draw()};
document.onclick=e=>{const t=e.target.dataset;
 if(t.del!=null&&confirm('Remove this employee? Their log entries are kept.'))s.emps.splice(t.del,1);
 else if(t.delb!=null)s.bh.splice(t.delb,1);else return;App.save();draw()};
$('#add').onclick=()=>{s.emps.push({n:'New employee',d:'Department',start:iso(new Date()),carry:0,team:'5-Day Week'});App.save();draw()};
$('#addbh').onclick=()=>{s.bh.push([iso(new Date()),'Bank holiday']);App.save();draw()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,1)]));a.download='holiday-tracker-backup.json';a.click()};
$('#im').onchange=e=>e.target.files[0].text().then(t=>{App.s=JSON.parse(t);App.save();location.reload()});
$('#rs').onclick=()=>{if(confirm('Replace all data with the original spreadsheet data?')){App.s=structuredClone(SEED);App.save();location.reload()}};
draw()});
</script></body></html>
